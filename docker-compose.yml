services:
  vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - vault-data:/vault/data
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1; code=$$?; [ $$code -eq 0 ] || [ $$code -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Destrava o Vault automaticamente sempre que o container "vault" (re)inicia,
  # usando as 3 chaves guardadas no arquivo .env (nao versionado). Veja a
  # secao 3.4 do README.md.
  vault-unseal:
    image: hashicorp/vault:1.18
    container_name: local-vault-unseal
    restart: unless-stopped
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_UNSEAL_KEY_1: ${VAULT_UNSEAL_KEY_1:?defina VAULT_UNSEAL_KEY_1 no arquivo .env (veja .env.example)}
      VAULT_UNSEAL_KEY_2: ${VAULT_UNSEAL_KEY_2:?defina VAULT_UNSEAL_KEY_2 no arquivo .env (veja .env.example)}
      VAULT_UNSEAL_KEY_3: ${VAULT_UNSEAL_KEY_3:?defina VAULT_UNSEAL_KEY_3 no arquivo .env (veja .env.example)}
    entrypoint: ["/bin/sh", "/unseal.sh"]
    volumes:
      - ./unseal.sh:/unseal.sh:ro

volumes:
  vault-data:
